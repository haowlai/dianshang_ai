# ==============================================================================
# docker-compose.infra.yml
# 用途：开发环境基础设施，仅启动 PostgreSQL (pgvector)、Redis、MinIO
# 隔离方案：使用独立项目命名空间 agentic-commerce 与非冲突端口 (5434, 6381, 9010, 9011)
# 启动命令：docker-compose -f docker-compose.infra.yml up -d
# 停止命令：docker-compose -f docker-compose.infra.yml down
# ==============================================================================

name: agentic-commerce

services:
  # ── PostgreSQL 16 + pgvector 向量扩展 ──
  postgres:
    image: pgvector/pgvector:pg16
    container_name: agentic-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-agentic_commerce}
      PGDATA: /var/lib/postgresql/data/pgdata
      TZ: Asia/Shanghai
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agentic_commerce"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Redis 7 缓存 / 任务队列 / 信号量 ──
  redis:
    image: redis:7-alpine
    container_name: agentic-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6381}:6379"
    volumes:
      - ./data/redis:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── MinIO 对象存储 (素材图片 / 视频 / 文案分镜) ──
  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: agentic-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "${MINIO_API_PORT:-9010}:9000"  # S3 API 隔离端口
      - "${MINIO_CONSOLE_PORT:-9011}:9001"  # Web Console 隔离端口
    volumes:
      - ./data/minio:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5
