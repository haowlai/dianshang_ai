version: '3.8'

services:
  # ── 1. PostgreSQL 16 + pgvector 向量扩展 ──
  postgres:
    image: pgvector/pgvector:pg16
    container_name: agentic-postgres-prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_strong_password_2026}
      POSTGRES_DB: ${POSTGRES_DB:-dianshang_ai}
      TZ: Asia/Shanghai
    volumes:
      - /data/docker-deploy/data/pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${POSTGRES_DB:-dianshang_ai}"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - agentic-prod-net

  # ── 2. Redis 7 高速缓存与任务队列 ──
  redis:
    image: redis:7-alpine
    container_name: agentic-redis-prod
    restart: always
    volumes:
      - /data/docker-deploy/data/redisdata:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-""}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - agentic-prod-net

  # ── 3. MinIO 私有化对象存储 ──
  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: agentic-minio-prod
    restart: always
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-miniopassword}
    volumes:
      - /data/docker-deploy/data/miniodata:/data
    command: server /data --console-address ":9001"
    ports:
      - "9001:9001" # MinIO Web控制台仅运维使用
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agentic-prod-net

  # ── 4. FastAPI Python 业务核心 ──
  backend:
    image: ${REGISTRY_URL:-local}/agentic-backend:${APP_VERSION:-v1.0.0}
    container_name: agentic-backend-prod
    restart: always
    env_file:
      - .env.prod
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - agentic-prod-net

  # ── 5. Vue 3 前端静态托管容器 ──
  frontend:
    image: ${REGISTRY_URL:-local}/agentic-frontend:${APP_VERSION:-v1.0.0}
    container_name: agentic-frontend-prod
    restart: always
    depends_on:
      - backend
    networks:
      - agentic-prod-net

  # ── 6. Nginx 生产反向代理网关 ──
  nginx:
    image: nginx:alpine
    container_name: agentic-nginx-prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - frontend
      - backend
    networks:
      - agentic-prod-net

networks:
  agentic-prod-net:
    driver: bridge
