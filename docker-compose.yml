# ==============================================================================
# docker-compose.yml
# 用途：生产 / 预发 / 完整容器化部署
# 启动命令：docker-compose up -d --build
# 停止命令：docker-compose down
# ==============================================================================

version: "3.8"

services:
  # ── PostgreSQL 16 + pgvector ──
  postgres:
    image: pgvector/pgvector:pg16
    container_name: agentic-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-agentic_commerce}
      TZ: Asia/Shanghai
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agentic_commerce"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agentic-net

  # ── Redis 7 ──
  redis:
    image: redis:7-alpine
    container_name: agentic-redis
    restart: always
    volumes:
      - redisdata:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agentic-net

  # ── MinIO 对象存储 ──
  minio:
    image: minio/minio:latest
    container_name: agentic-minio
    restart: always
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - miniodata:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agentic-net

  # ── FastAPI 后端服务 ──
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agentic-backend
    restart: always
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-agentic_commerce}
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-agentic-assets}
      AUTH_ENABLED: "true"
      ALLOW_MOCK_ASSETS: "false"
      APP_ENV: prod
    ports:
      - "8002:8002"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - agentic-net

  # ── Vue 3 前端静态托管服务 ──
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: agentic-frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - agentic-net

  # ── Nginx 统一反向代理网关 ──
  nginx:
    image: nginx:alpine
    container_name: agentic-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./conf/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./data/static:/usr/share/nginx/html/static:ro
    depends_on:
      - backend
      - frontend
    networks:
      - agentic-net

volumes:
  pgdata:
  redisdata:
  miniodata:

networks:
  agentic-net:
    driver: bridge
